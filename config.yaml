# Pipeline configuration: everything tunable lives here.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  # Never used as model features: row id and COMPAS's own score.
  drop_columns: ["id", "decile_score", "score_text"]

# Locked final test set (stratified). Never used to fit, tune or choose anything.
# Do not change these values: a new seed would give a different, partly "seen" test set.
test_set:
  size: 0.2
  random_state: 42

# Stratified k-fold cross-validation on the development set.
# Same random_state = same folds for every run and every model.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  # Metrics reported for every fold (scikit-learn scorer names, or fbeta_<beta>).
  metrics: ["accuracy"]
  # The metric that tuning optimises and the scoreboard ranks by (must be in `metrics`).
  selection_metric: "accuracy"
  n_jobs: 1             # -1 = all cores (only worth it for slow models such as random forest)

# Cleaning rules from the week 3 diagnosis, read by clean_dataset().
diagnostics:
  id_column: "id"
  # Columns that load as text only because of placeholder tokens.
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # "nan" is listed because the category cleanup turns real NaNs into the string "nan".
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  # Multicollinear columns, dropped by clean_dataset().
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# Preprocessing recipe. Fitted on training rows only, inside the model Pipeline.
preprocessing:
  encoder: "target"      # "onehot" | "ordinal" | "count" | "target"
  scaler: "robust"       # "none" | "standard" | "minmax" | "robust"
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  # Week 5: engineered features, added to the numeric features automatically.
  # Options: log_priors, has_priors, priors_per_adult_year, has_juvenile_record,
  # has_juvenile_felony, young_with_priors. Use [] to switch feature engineering off.
  engineered_features: ["log_priors", "has_priors", "priors_per_adult_year",
                        "has_juvenile_record", "has_juvenile_felony", "young_with_priors"]
  # Columns that also get a "<col>_was_missing" flag (MNAR-diagnosed).
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  random_state: 42       # seed for the target encoder's internal cross-fitting
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

# Model: "dummy" | "logistic_regression" | "naive_bayes" | "decision_tree" | "random_forest"
#        | "oblique_random_forest" | "adaboost"
# To switch, replace the active block with one of the examples below.
model:
  type: "naive_bayes"
  params: {}

  # Other models' params, to swap in. class_weight "balanced" weights each class by 1 / its frequency
  # dummy:                  {strategy: most_frequent}   # the no-model floor
  # logistic_regression:    {max_iter: 2000, class_weight: balanced}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42, class_weight: balanced}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1, class_weight: balanced}
  # oblique_random_forest:  {n_estimators: 200, random_state: 42, n_jobs: -1}
  # adaboost:               {n_estimators: 100, learning_rate: 0.5, random_state: 42}

tuning:
  enabled: true
  n_trials: 30
  n_splits: 5                                       # folds that score each candidate
  random_state: 42                                  # seeds the sampler and those folds
  # Keys are Pipeline parameter names. Types: int / float (low, high, log) or categorical (choices).
  # Ensembles take minutes per run: use a small n_trials while testing.
  search_spaces:
    logistic_regression:
      model__C: {type: float, low: 0.001, high: 100.0, log: true}
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 0.000000000001, high: 0.1, log: true}

output:
  results_dir: "results"            # each run's full report: results/<model>/run_<timestamp>.txt
  scoreboard: "results/runs.csv"    # one row per run, ranked on screen after every run